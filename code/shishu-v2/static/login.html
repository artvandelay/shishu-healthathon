<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b2a4a">
  <title>SHISHU — Pre-Consultation Voice Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1b2a4a;
      --muted: #5c6e84;
      --line: #e2e8f0;
      --bg: #f8fafc;
      --card: #ffffff;
      --navy: #1b2a4a;
      --navy-dark: #121d33;
      --yellow: #e89d2d;
      --yellow-dark: #cf861b;
      --yellow-soft: #fef6e9;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Nirmala UI", "Noto Sans Devanagari", sans-serif;
      background:
        radial-gradient(900px 420px at 0% -10%, #fef3df 0%, transparent 60%),
        radial-gradient(800px 420px at 100% 0%, #eef4f9 0%, transparent 55%),
        var(--bg);
    }

    .card {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 32px 28px 28px;
      box-shadow: 0 18px 50px rgba(27, 42, 74, 0.08);
    }

    .mark {
      margin: 0 0 14px;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--yellow-soft);
      color: var(--yellow-dark);
      font-weight: 750;
      font-size: 20px;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.25;
      font-weight: 720;
    }

    .lede {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.45;
    }

    .field + .field { margin-top: 14px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 18px;
    }

    input:focus {
      outline: 3px solid rgba(27, 42, 74, 0.25);
      border-color: var(--navy);
    }

    button {
      width: 100%;
      margin-top: 14px;
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: var(--navy);
      color: #fff;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--navy-dark); }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(27, 42, 74, 0.35);
      outline-offset: 2px;
    }

    .hint {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .error {
      margin: 12px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="mark">श</p>
    <h1>SHISHU — Pre-Consultation Voice Assistant</h1>
    <p class="lede">Enter your name and the passcode to open a Hindi pre-consultation call or the clinical dashboard.</p>
    <form id="login-form">
      <div class="field">
        <label for="username">Your name</label>
        <input id="username" name="username" type="text" autocomplete="name" placeholder="Enter your name" required>
      </div>
      <div class="field">
        <label for="passcode">Passcode</label>
        <input id="passcode" name="passcode" type="password" autocomplete="current-password" required>
      </div>
      <button id="continue" type="submit">Continue</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>
  </main>
  <script>
    (function () {
      const form = document.getElementById("login-form");
      const usernameInput = document.getElementById("username");
      const passcodeInput = document.getElementById("passcode");
      const button = document.getElementById("continue");
      const error = document.getElementById("error");

      function safeNext() {
        const next = new URLSearchParams(location.search).get("next") || "/";
        if (!next.startsWith("/") || next.startsWith("//") || next.startsWith("/\\")) return "/";
        return next;
      }

      function showError(message) {
        error.textContent = message;
        error.hidden = false;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        error.hidden = true;
        const username = usernameInput.value.trim();
        const passcode = passcodeInput.value.trim();
        if (!username) {
          showError("Enter your name to continue.");
          usernameInput.focus();
          return;
        }
        if (!passcode) {
          showError("Enter the passcode to continue.");
          passcodeInput.focus();
          return;
        }
        button.disabled = true;
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ username: username, passcode: passcode })
          });
          if (res.status === 401) {
            showError("That name or passcode was not accepted.");
            passcodeInput.select();
            return;
          }
          if (!res.ok) {
            showError("Sign-in failed. Try again.");
            return;
          }
          location.href = safeNext();
        } catch (err) {
          showError("Could not reach SHISHU. Check the connection and try again.");
        } finally {
          button.disabled = false;
        }
      });

      usernameInput.focus();
    })();
  </script>
</body>
</html>
