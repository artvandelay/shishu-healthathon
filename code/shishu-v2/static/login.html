<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e6b63">
  <title>SHISHU — Pre-Consultation Voice Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2430;
      --muted: #5c6672;
      --line: #e4d8c8;
      --card: #fffdf9;
      --teal: #0e6b63;
      --teal-dark: #0a524c;
      --danger: #9d2c24;
      --danger-bg: #fdecea;
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Nirmala UI", "Noto Sans Devanagari", sans-serif;
      background:
        radial-gradient(900px 420px at 0% -10%, #f6d7b8 0%, transparent 60%),
        radial-gradient(800px 420px at 100% 0%, #d7eee6 0%, transparent 55%),
        #f3ecdf;
    }

    .card {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 32px 28px 28px;
      box-shadow: 0 18px 50px rgba(70, 46, 20, 0.08);
    }

    .mark {
      margin: 0 0 14px;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e7f4f1;
      color: var(--teal);
      font-weight: 750;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      line-height: 1.25;
      font-weight: 720;
    }

    .lede {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.45;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid #d9cbb8;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 18px;
    }

    input:focus {
      outline: 3px solid rgba(14, 107, 99, 0.28);
      border-color: var(--teal);
    }

    button {
      width: 100%;
      margin-top: 14px;
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: var(--teal);
      color: #fff;
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: var(--teal-dark); }

    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(14, 107, 99, 0.35);
      outline-offset: 2px;
    }

    .error {
      margin: 12px 0 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="mark">श</p>
    <h1>SHISHU — Pre-Consultation Voice Assistant</h1>
    <p class="lede">Enter the passcode to open a Hindi screening call or the clinical dashboard.</p>
    <form id="login-form">
      <label for="passcode">Passcode</label>
      <input id="passcode" name="passcode" type="password" autocomplete="current-password" required>
      <button id="continue" type="submit">Continue</button>
      <p id="error" class="error" role="alert" hidden></p>
    </form>
  </main>
  <script>
    (function () {
      const form = document.getElementById("login-form");
      const input = document.getElementById("passcode");
      const button = document.getElementById("continue");
      const error = document.getElementById("error");

      function safeNext() {
        const next = new URLSearchParams(location.search).get("next") || "/";
        if (!next.startsWith("/") || next.startsWith("//") || next.startsWith("/\\")) return "/";
        return next;
      }

      function showError(message) {
        error.textContent = message;
        error.hidden = false;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        error.hidden = true;
        const passcode = input.value.trim();
        if (!passcode) {
          showError("Enter the passcode to continue.");
          return;
        }
        button.disabled = true;
        try {
          const res = await fetch("/api/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ passcode: passcode })
          });
          if (res.status === 401) {
            showError("That passcode was not accepted.");
            input.select();
            return;
          }
          if (!res.ok) {
            showError("Sign-in failed. Try again.");
            return;
          }
          location.href = safeNext();
        } catch (err) {
          showError("Could not reach SHISHU. Check the connection and try again.");
        } finally {
          button.disabled = false;
        }
      });

      input.focus();
    })();
  </script>
</body>
</html>
