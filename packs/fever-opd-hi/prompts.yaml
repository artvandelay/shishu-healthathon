# `who` is "{name} जी, " when they gave a name, else "".
# Never a diagnosis, never an all-clear.
closings:
  emergency: "{who}यह तुरंत दिखाने वाली बात है। अभी नज़दीकी अस्पताल जाइए, या 108 पर कॉल कीजिए। अब तक की जानकारी मैंने डॉक्टर के लिए नोट कर ली है। नमस्ते।"
  caller_stop: "कोई बात नहीं, {who}अब तक की जानकारी मैंने नोट कर ली है। जब समय मिले, दोबारा कॉल करके बाकी सवाल पूरे कर लीजिए। नमस्ते।"
  silence: "लगता है आप अभी बात नहीं कर पा रहे हैं। कोई बात नहीं। अब तक आपने जो समय दिया, उसके लिए बहुत धन्यवाद। अभी कुछ सवाल बाकी हैं, इसलिए यह जानकारी अधूरी है। जब समय मिले, दोबारा कॉल करके इसे पूरा कर लीजिए। नमस्ते।"
  time_limit: "{who}आज हमारी बात काफी लंबी हो गई। इतना समय देने के लिए बहुत धन्यवाद। अभी कुछ सवाल बाकी हैं, इसलिए यह जानकारी अधूरी है। जब समय मिले, दोबारा कॉल करके इसे पूरा कर लीजिए। नमस्ते।"
  technical_failure: "माफ़ कीजिए, {who}अभी कुछ तकनीकी दिक्कत आ गई है। अब तक की जानकारी मैंने नोट कर ली है। अभी कुछ सवाल बाकी हैं, इसलिए यह जानकारी अधूरी है। जब समय मिले, दोबारा कॉल करके इसे पूरा कर लीजिए। नमस्ते।"
  complete_concern: "{who}इतना ध्यान से बताने के लिए बहुत धन्यवाद। आपने जो बताया, उसके आधार पर डॉक्टर कुछ जाँचें कर सकते हैं। आपकी रिपोर्ट तैयार हो रही है। इसे आप डॉक्टर या ASHA दीदी को दिखा सकते हैं। नमस्ते।"
  complete_clear: "{who}इतना ध्यान से बताने के लिए बहुत धन्यवाद। अगर बुखार बढ़े, या साँस, उल्टी या कमज़ोरी में कोई नई बात दिखे, तो तुरंत डॉक्टर से मिलें। आपकी रिपोर्ट तैयार हो रही है। नमस्ते।"

# How the patient is named out loud. Single-patient pack: no roster, no which-item.
roster_format:
  month_unit: "महीने"
  year_unit: "साल"
  tag_labels:
    male: "मरीज़"
    female: "मरीज़"
    unknown: ""
  patient_default_who: "आप"
  which_item:
    template: "यह किसकी बात है — {items}?"
    or_joiner: ", या "
    named_female: "{age} वाली {name}"
    named_male: "{age} वाले {name}"
    unnamed_female: "{age} वाली मरीज़"
    unnamed_male: "{age} वाले मरीज़"
    unnamed_other: "{age} वाले"
    middle_female: ""
    middle_male: ""
