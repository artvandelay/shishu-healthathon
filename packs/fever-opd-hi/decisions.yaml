# packs/fever-opd-hi/decisions.yaml
# `gemini-decision-1` head definitions and their start-up-gated thresholds.
# All keys in `intake.pack._THRESHOLDS` must be present: a pack that omits
# one fails to load. There is no default and no "0.5 will do".

model: gemini-decision-1

heads:
  # ---- Group A: safety, endpointing, privacy, and the active answer ----------
  danger_now:
    type: noul
    instructions: Is the caller describing an active life-threatening medical emergency happening RIGHT NOW in caller_utterance
      (such as not breathing, severe fast breathing, blue lips now, unconsciousness, unstoppable seizures, unstoppable bleeding,
      or explicitly stating an emergency right now)?
    criteria:
      true_description: Active life-threatening danger sign happening right now in caller_utterance, or explicit statement
        of a medical emergency happening right now.
      false_description: A fever answer, a reported symptom that is not happening right now, a past illness, a resolved
        event, a routine yes/no answer, or no emergency happening right now.

  caller_stop:
    type: noul
    instructions: Does the caller explicitly ask to end, stop, or disconnect the call now in caller_utterance?
    criteria:
      true_description: Caller explicitly asks to end, stop, or hang up the call now or continue another time.
      false_description: Caller asks only to pause or wait briefly, asks a clarification question, or gives a normal reply.

  mentions_profile:
    type: noul
    instructions: Does caller_utterance state, add, or correct the patient's own profile (the patient's name or the patient's
      age), rather than merely answering a fever, symptom, or danger-sign question?
    criteria:
      true_description: Caller states or corrects the patient's name or the patient's age in years.
      false_description: Caller only answers a fever, symptom, danger-sign, treatment, or travel question, asks for clarification,
        or makes no statement or update about the patient's name or age.

  redact_patient_note:
    type: noul
    instructions: Does caller_utterance name a specific confirmed diagnosis label the form has no slot for (such as a positive
      malaria or dengue test report, typhoid, or a named laboratory finding) rather than plain everyday symptoms or ordinary
      treatment?
    criteria:
      true_description: Names a specific confirmed diagnosis or a positive laboratory report in caller_utterance.
      false_description: Describes only plain everyday symptoms, body parts, temperatures, medicines, or ordinary care without
        naming a confirmed diagnosis.

  active_outcome:
    type: choice
    instructions: How does caller_utterance respond to active_question? (If caller_utterance answers active_question AND also
      mentions another topic, classify how it answers active_question.)
    criteria:
      clear: Denies, answers no, negative, normal, nothing further, or "कुछ नहीं" for active_question (even if also mentioning
        a different topic in the same sentence). For a test-result question, choose clear only when the test/check was done
        and had no abnormality, or she denies having the condition — NOT when she says the test itself was never done
        (जाँच नहीं हुई थी is unknown, not clear).
      concern: Affirms, answers yes, agrees, or provides the symptom, duration, or description that active_question asks for
        (even if also mentioning a different topic).
      unknown: States that they do not know, do not remember, or are unsure about active_question, or states that a requested
        screening test or medical check (such as a blood test, an X-ray/scan, or a hearing/vision test) was NEVER done or never
        tested (जाँच नहीं हुई थी, टेस्ट नहीं करवाया), even when the sentence is prefaced with "नहीं" (as in "नहीं डॉक्टर,
        जाँच नहीं हुई थी").
      clarify: Asks what active_question itself or a term inside active_question means, or says they did not understand
        active_question.
      retract: Takes back or reverses a yes or an affirmative answer just given for active_question (or its parent_question
        when active_question is a sub-question).
      other: caller_utterance gives NO answer at all to active_question (for example when it talks ONLY about a different
        topic without saying yes or no to active_question, only updates the patient's name or age, or is unrelated chatter).

  detail_present:
    type: noul
    instructions: Does caller_utterance already include concrete factual or clinical detail answering followup_question,
      rather than only a bare yes/no or acknowledgement?
    criteria:
      true_description: Includes concrete factual or clinical detail (such as a duration, a count, a medicine name, a breathing
        description, or a place) answering followup_question.
      false_description: Only a bare yes or no, bare acknowledgement, statement of not knowing, clarification question, or
        no concrete detail.

  jump_topic:
    type: noul
    instructions: Does caller_utterance volunteer a specific clinical fact, a confirmed diagnosis, or a medicine taken outside
      active_question (for example naming a positive malaria report, a course of antibiotics, or a hospital visit) that warrants
      jumping directly to a related topic rather than continuing routine order?
    criteria:
      true_description: Volunteers a concrete clinical fact or a treatment that another catalog question or follow-up would
        ask about and that is NOT what active_question asked (a positive test report, a named medicine, a hospital admission).
      false_description: Answers only active_question, gives a bare yes/no or a symptom detail that belongs to active_question
        or its follow-up, asks for clarification, or makes unrelated small talk.

  active_topic:
    type: noul
    instructions: >-
      Does caller_utterance directly answer or address the exact clinical criterion or topic asked in
      active_question — including yes/no, a listed option, or a direct on-topic description in the caller's own words
      outside the listed options — rather than only mentioning a side effect or different symptom that neither affirms
      nor denies the specific criterion asked, talking about another person or question only, asking for clarification
      without answering, or making non-medical remarks?
    criteria:
      true_description: >-
        Directly answers or addresses the clinical criterion or topic that active_question asked (yes/no, a listed
        option, or an on-topic description in words outside the listed options).
      false_description: >-
        Mentions only a side effect or different symptom that does not affirm or deny the specific criterion asked in
        active_question; talks only about another person or question; asks clarification without answering; or makes
        non-medical remarks.

  residual_clinical:
    type: noul
    instructions: >-
      Does caller_utterance mention a concrete medical symptom, side effect, reaction, illness, injury, or treatment
      that is not captured by a bare yes/no or a listed option of active_question?
    criteria:
      true_description: >-
        Mentions a concrete medical symptom, side effect, reaction, illness, injury, or treatment not captured by a
        bare yes/no or listed option of active_question.
      false_description: >-
        Only a bare yes/no or listed option answering active_question, demographic profile facts, a clarification
        question, or non-medical household or background talk.

  asks_clarify:
    type: noul
    instructions: >-
      Does caller_utterance ask what active_question means, ask what any medical or clinical term means
      (whether that term appears inside active_question or is mentioned separately in caller_utterance),
      ask to repeat, or say they did not understand?
    criteria:
      true_description: >-
        Asks the meaning of active_question or of any medical/clinical term (in active_question or mentioned
        separately), asks to repeat, or says they did not understand.
      false_description: >-
        Gives an answer, denial, symptom report, or unrelated talk without asking for clarification.

  clarify_target_template:
    type: choice
    instructions: >-
      When the caller asks for clarification, which separate screening item are they asking about, or
      active_or_none when asking about active_question or no specific separate screening item?
    option_template: '{question_say} ({need})'
    catchall_description: >-
      Caller is asking about active_question itself, or no specific separate screening item.

  stated_template:
    type: choice
    instructions: >-
      OUTSIDE of active_question and parent_question, does caller_utterance ALSO explicitly state or revise
      THIS SEPARATE question: "{question_say}" ({need})? Choose unmentioned if caller_utterance only answers active_question.
    criteria:
      concern: 'Explicitly names or describes "{need}" as present outside active_question.'
      clear: 'Explicitly denies or retracts "{need}" by topic outside active_question (never for a bare नहीं to active_question).'
      unmentioned: 'Only answers active_question, updates profile details, or does not explicitly mention "{need}".'

  item_ref_template:
    type: choice
    # This pack is single-patient, so the roster head has no children to resolve. It is
    # declared only so the head-group builder has a well-formed, always-other choice set.
    instructions: Which patient does caller_utterance identify as affected? This pack has exactly one patient, so choose
      other unless the caller explicitly denies the concern.
    option_template: Patient {id} (age={age_label}) has or experienced the reported concern.
    unnamed_label: unnamed
    all_description: The patient and everyone mentioned experienced the reported concern.
    other_description: The single patient in this pack is the only subject; the concern is denied, retracted, or not about
      a selected person.

  next_qid_template:
    type: choice
    instructions: Which open question is caller_utterance answering or volunteering information about, other than active_question
      and parent_question?
    option_template: '{question_say} ({need})'
    other_description: The caller is not referring to any open question outside active_question and parent_question, or there
      is not enough evidence to identify one.

thresholds:
  # Safety, endpointing, privacy. This pack asks closed, factual questions, so these
  # sit slightly tighter than the reflective rare-disease screen: a fever history is
  # rarely hedged, and an over-eager danger_now would stop a call for a bad cough.
  danger_now_min_yes: 0.494
  caller_stop_min_yes: 0.5739
  mentions_profile_min_yes: 0.4914
  redact_patient_note_min_yes: 0.5606
  detail_present_min_yes: 0.5262
  jump_topic_min_yes: 0.7
  active_topic_min_yes: 0.55
  residual_clinical_min_yes: 0.55
  asks_clarify_min_yes: 0.55
  outcome_min_confidence: 0.5196
  outcome_min_margin: 0.2297
  # Short option sets ("3 दिन से कम / 3 से 7 दिन / 7 दिन से ज़्यादा") separate cleanly,
  # so the choice gate can be a little stricter than the 58-option screening pack.
  choice_min_confidence: 0.55
  choice_min_margin: 0.22
  multi_choice_min_yes: 0.55
  # Severity is a 0..3 rubric read from a spoken description, not a tick, so it keeps
  # the looser confidence used for ordered scales.
  score_min_confidence: 0.45
  stated_min_confidence: 0.8
  stated_min_margin: 0.35
  clarify_target_min_confidence: 0.75
  clarify_target_min_margin: 0.30
  item_ref_min_confidence: 0.65
  item_ref_min_margin: 0.05
