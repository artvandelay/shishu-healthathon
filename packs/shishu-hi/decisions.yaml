model: gemini-decision-1
heads:
  danger_now:
    type: noul
    instructions: >-
      Is the caller describing an active life-threatening medical emergency happening RIGHT NOW in caller_utterance
      (such as not breathing, severe fast breathing, blue lips now, unconsciousness, unstoppable seizures,
      unstoppable bleeding, or explicitly stating an emergency right now)?
    criteria:
      true_description: >-
        Active life-threatening danger sign happening right now in caller_utterance, or explicit statement
        of a medical emergency happening right now.
      false_description: >-
        Past medical history, a resolved event from earlier in life, a routine yes/no or symptom answer,
        or no emergency happening right now.
  caller_stop:
    type: noul
    instructions: Does the caller explicitly ask to end, stop, or disconnect the call now in caller_utterance?
    criteria:
      true_description: Caller explicitly asks to end, stop, or hang up the call now or continue another
        time.
      false_description: Caller asks only to pause or wait briefly, asks a clarification question, or
        gives a normal reply.
  mentions_profile:
    type: noul
    instructions: >-
      Does caller_utterance state, add, correct, or point out a gap in the caller's own demographic profile (her
      name, marital status as married/about to marry/unmarried, total child count, or her children's number, ages,
      sex, or names) — including telling us about a child, twin, or multiple that was missed or misheard earlier,
      even without restating that child's age — rather than merely referring to an already-known child in roster
      while answering a clinical or child-selection question?
    criteria:
      true_description: >-
        Caller states, adds, or corrects her own name, marital status, total child count, or a child's age, sex, or
        name (including giving remaining children's ages, adding another child, or saying she has twins/multiples
        or another child we did not record or did not hear — such as "मेरे ट्विंस बच्चे हैं, आप वो सुन नहीं पाए" —
        even when no age is restated).
      false_description: >-
        Caller only answers a clinical, pregnancy, or family question, refers to an already-known child from roster
        (such as oldest, middle, youngest, all of them, or by existing name) to answer a symptom question, asks for
        clarification, or makes no statement or update about her demographic profile.
  redact_patient_note:
    type: noul
    instructions: >-
      Does caller_utterance name a specific genetic, inherited, or rare disease diagnosis label (such
      as hemophilia, Duchenne muscular dystrophy, Pompe, Gaucher, SCID, SMA, MPS, Wiskott-Aldrich, sickle
      cell disease, cystic fibrosis, Fanconi anemia, PKU, thalassemia major, or any other named rare disorder
      or syndrome) rather than plain everyday symptoms, common conditions (BP, sugar, thyroid, jaundice,
      fits, cancer, kidney stones), or routine thalassemia minor/trait carrier screening?
    criteria:
      true_description: >-
        Names a specific genetic, inherited, or rare disease diagnosis or syndrome label (including thalassemia
        major) in caller_utterance.
      false_description: >-
        Describes only plain everyday symptoms, treatments, body parts, common conditions (such as BP,
        diabetes, thyroid, jaundice, seizures, generic cancer), or routine thalassemia minor/trait carrier
        checks without naming a rare or genetic disease diagnosis.
  active_outcome:
    type: choice
    instructions: >-
      How does caller_utterance respond to active_question? (If caller_utterance answers active_question
      AND also mentions another topic, classify how it answers active_question.)
    criteria:
      clear: >-
        Denies, answers no, negative, normal, or nothing further for active_question (even if also mentioning
        a different topic in the same sentence). For a test-result question, choose clear only when the test/check
        was done and had no abnormality, or she denies having the condition — NOT when she says the test itself
        was never done (जाँच नहीं हुई थी is unknown, not clear).
      concern: >-
        Affirms, answers yes, agrees to start, identifies an affected child when active_question asks
        which child, or provides the answer requested by active_question (even if also mentioning a different
        topic).
      unknown: >-
        States that she does not know, does not remember, or is unsure about active_question, or states that
        a requested screening test or medical check (such as a thalassemia blood test, a scan, or a hearing/vision
        test) was NEVER done or never tested (जाँच नहीं हुई थी, टेस्ट नहीं करवाया), even when the sentence is
        prefaced with "नहीं" (as in "नहीं डॉक्टर, जाँच नहीं हुई थी").
      clarify: >-
        Asks what active_question itself or a term inside active_question means, or says she did not understand
        active_question.
      retract: >-
        Takes back or reverses a yes or affirmative answer just given for active_question (or its parent_question
        when active_question is a sub-question).
      other: >-
        caller_utterance gives NO answer at all to active_question (for example when it talks ONLY about
        a different topic without saying yes or no to active_question, rules out one child on a which-child
        question without naming the affected child, only updates demographic profile details, or is unrelated
        chatter). Also choose other when the caller interrupts to correct or revise an earlier question
        ("अरे रुकिए, मैंने पहले गलत बोल दिया — ...", "wait, I said it wrong earlier") and then describes
        only that other item without answering active_question: the correction is not an answer to the
        question being asked now.
  detail_present:
    type: noul
    instructions: >-
      Does caller_utterance already include concrete factual or clinical detail answering followup_question,
      rather than only a bare yes/no or acknowledgement?
    criteria:
      true_description: >-
        Includes concrete factual or clinical detail (such as duration, count, cause, symptom, age, or
        affected person) answering followup_question.
      false_description: >-
        Only a bare yes or no, bare acknowledgement, statement of not knowing, clarification question,
        or no concrete detail.
  jump_topic:
    type: noul
    instructions: >-
      Does caller_utterance volunteer a specific clinical condition or family history outside active_question
      (for example naming thalassemia, sickle cell, a transfusion history, a child's death, or a relative
      with the same problem) that warrants jumping directly to a related follow-on topic rather than continuing
      routine order?
    criteria:
      true_description: >-
        Volunteers a concrete clinical condition or family history that another catalog question or follow-up
        would ask about and that is NOT what active_question asked (unprompted transfusion, a diagnosed
        blood disorder, a death in the family, consanguinity, a relative with the same problem).
      false_description: >-
        Answers only active_question, gives a bare yes/no or a symptom detail that belongs to active_question
        or its follow-up, asks for clarification, or makes unrelated small talk.
  active_topic:
    type: noul
    instructions: >-
      Does caller_utterance directly answer or address the exact clinical criterion or topic asked in
      active_question — including yes/no, a listed option, or a direct on-topic description in the caller's own words
      outside the listed options — rather than only mentioning a side effect or different symptom that neither affirms
      nor denies the specific criterion asked, talking about another person or question only, asking for clarification
      without answering, or making non-medical remarks?
      An explicit affirmative or negative reply (yes/हाँ/no/नहीं) to active_question ALWAYS addresses active_question
      (true), even when followed by a diagnosis name or extra detail, whereas mentioning only a separate symptom or
      side effect with NO yes/no to active_question is false.
    criteria:
      true_description: >-
        Directly answers or addresses the clinical criterion or topic that active_question asked (yes/no, a listed
        option, or an on-topic description in words outside the listed options). An explicit affirmative or negative
        reply (yes/हाँ/no/नहीं) to active_question ALWAYS addresses active_question, even when followed by a diagnosis
        name or extra detail, whereas mentioning only a separate symptom or side effect with NO yes/no to
        active_question does not.
      false_description: >-
        Mentions only a side effect or different symptom that does not affirm or deny the specific criterion asked in
        active_question; talks only about another person or question; asks clarification without answering; makes
        non-medical remarks; or interrupts to correct an earlier question ("अरे रुकिए, मैंने पहले गलत बोल दिया — ...",
        "wait, I said it wrong earlier") and describes only that other item, without giving a yes/no or any direct
        answer to active_question. A correction that ALSO carries an explicit yes/हाँ or no/नहीं to active_question
        remains true.
  residual_clinical:
    type: noul
    instructions: >-
      Does caller_utterance mention a concrete medical or clinical fact — a symptom, side effect, reaction,
      illness, injury, treatment, hospital stay, pregnancy or birth event, or a loss or death — that is NOT
      already captured by answering active_question? An answer to active_question captures only the exact
      condition active_question asked about. When active_question is a demographic or intro question (a
      name, an age, marital status, child count or ages, or readiness to start), a concrete clinical fact
      shared in that turn is not captured by the demographic question and therefore counts as true.
    criteria:
      true_description: >-
        States a concrete medical or clinical fact (a symptom, side effect, reaction, illness, injury,
        treatment, hospital stay, pregnancy or birth event, or a loss or death) that answering active_question
        does not already capture — including any such fact volunteered while answering a demographic or intro
        question about a name, an age, marital status, child count or ages, or readiness to start.
      false_description: >-
        Only confirms, denies, or elaborates on the exact clinical condition active_question already asked
        (such as confirming a hospital stay when asked about that hospital stay, or confirming seizures when
        asked about seizures), or gives only a bare yes/no, a bare listed option, purely demographic
        information with no clinical fact, a clarification question, or non-medical talk.
  asks_clarify:
    type: noul
    instructions: >-
      Does caller_utterance ask what active_question means, ask what any medical or clinical term means
      (whether that term appears inside active_question or is mentioned separately in caller_utterance),
      ask to repeat, or say they did not understand? Also true for a meta-question about this call or the
      notes, such as "did you note that?" or "are you asking about kids or adults?"
      (for example "आप बच्चे की पूछ रहे कि बूढ़े की पूछ रहे?").
    criteria:
      true_description: >-
        Asks the meaning of active_question or of any medical/clinical term (in active_question or mentioned
        separately), asks to repeat, says they did not understand, or asks a meta-question about the call
        or the notes, such as "did you note that?" or "are you asking about kids or adults?".
      false_description: >-
        Gives an answer, denial, symptom report, or unrelated talk without asking for clarification.
        A question about what was noted, or about whether the question is about kids or adults, is a
        clarification, not unrelated talk.
  clarify_target_template:
    type: choice
    instructions: >-
      When the caller asks for clarification, which separate screening item are they asking about, or
      active_or_none when asking about active_question or no specific separate screening item?
    option_template: '{question_say} ({need})'
    catchall_description: >-
      Caller is asking about active_question itself, or no specific separate screening item.
  stated_template:
    type: choice
    instructions: >-
      OUTSIDE of active_question and parent_question, does caller_utterance ALSO explicitly state or revise
      THIS SEPARATE screening item (group={group}): "{question_say}" ({need})?
      CRITICAL: A bare yes/no or a reply that only answers active_question does NOT state an answer to this separate item —
      choose unmentioned unless caller_utterance specifically names or describes "{need}" for group={group} (child-scoped items
      apply ONLY to the caller's own children; family-scoped items apply ONLY to relatives outside the caller's children).
    criteria:
      concern: >-
        Caller_utterance explicitly names or describes "{need}" as present for group={group} (beyond merely answering active_question).
      clear: >-
        Caller_utterance explicitly denies or retracts "{need}" by name/topic for group={group} (NEVER for a bare "नहीं" to active_question).
      unmentioned: >-
        Caller_utterance only answers active_question (such as a bare हाँ/नहीं or active_question's own topic), talks about a different
        person/scope, updates profile details, or does not explicitly mention "{need}".
  item_ref_template:
    type: choice
    instructions: >-
      Which child from roster has or experienced a health symptom, medical event, or concern affirmed in
      caller_utterance (whether answering active_question/parent_question or volunteering another child symptom
      in the same turn)? Choose a child whenever caller_utterance identifies that child as having a reported
      concern; choose other ONLY if no child concern is affirmed at all in caller_utterance or a child is
      mentioned solely to rule them out.
    option_template: >-
      Child {id} (rank={rank}, age={age_label}, tag={tag}, name={name_or_unnamed}) has or experienced
      the reported concern.
    unnamed_label: unnamed
    all_description: All or every child in roster (such as both or all of them) experienced the
      reported concern.
    other_description: >-
      No child concern is affirmed in caller_utterance, every symptom is denied or retracted,
      or a child is mentioned only to say they were not affected.
  next_qid_template:
    type: choice
    instructions: >-
      Which open screening question is caller_utterance answering or volunteering information about, other
      than active_question and parent_question?
    option_template: '{question_say} ({need})'
    other_description: >-
      The caller is not referring to any open screening question outside active_question and parent_question,
      or there is not enough evidence to identify one.
thresholds:
  danger_now_min_yes: 0.494
  caller_stop_min_yes: 0.5739
  mentions_profile_min_yes: 0.4914
  redact_patient_note_min_yes: 0.5606
  detail_present_min_yes: 0.5262
  jump_topic_min_yes: 0.7
  active_topic_min_yes: 0.55
  residual_clinical_min_yes: 0.55
  asks_clarify_min_yes: 0.55
  outcome_min_confidence: 0.5196
  outcome_min_margin: 0.2297
  choice_min_confidence: 0.52
  choice_min_margin: 0.2
  multi_choice_min_yes: 0.55
  score_min_confidence: 0.45
  stated_min_confidence: 0.8
  stated_min_margin: 0.35
  clarify_target_min_confidence: 0.75
  clarify_target_min_margin: 0.30
  item_ref_min_confidence: 0.65
  item_ref_min_margin: 0.05
