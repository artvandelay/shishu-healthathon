# `who` is "{name} जी, " when she gave a name, else "".
# Never a diagnosis, never an all-clear.
closings:
  emergency: "{who}यह तुरंत दिखाने वाली बात है। अभी बच्चे को नज़दीकी अस्पताल ले जाइए, या 108 पर कॉल कीजिए। अब तक की जानकारी मैंने डॉक्टर के लिए नोट कर ली है। नमस्ते।"
  caller_stop: "कोई बात नहीं, {who}अब तक की जानकारी मैंने नोट कर ली है। जब समय मिले, दोबारा कॉल करके बाकी सवाल पूरे कर लीजिए। नमस्ते।"
  silence: "लगता है आप अभी बात नहीं कर पा रही हैं। कोई बात नहीं। अब तक आपने जो समय दिया, उसके लिए बहुत धन्यवाद। अभी कुछ सवाल बाकी हैं, इसलिए यह जानकारी अधूरी है। जब समय मिले, दोबारा कॉल करके इसे पूरा कर लीजिए। नमस्ते।"
  time_limit: "{who}आज हमारी बात काफी लंबी हो गई। इतना समय देने के लिए बहुत धन्यवाद। अभी कुछ सवाल बाकी हैं, इसलिए यह जानकारी अधूरी है। जब समय मिले, दोबारा कॉल करके इसे पूरा कर लीजिए। नमस्ते।"
  technical_failure: "माफ़ कीजिए, {who}अभी कुछ तकनीकी दिक्कत आ गई है। अब तक की जानकारी मैंने नोट कर ली है। अभी कुछ सवाल बाकी हैं, इसलिए यह जानकारी अधूरी है। जब समय मिले, दोबारा कॉल करके इसे पूरा कर लीजिए। नमस्ते।"
  complete_concern: "{who}इतना ध्यान से बताने के लिए बहुत धन्यवाद। आपने जो बताया, उसमें से कुछ बातों की जाँच डॉक्टर या स्वास्थ्य कार्यकर्ता से करवाना अच्छा रहेगा। आपकी रिपोर्ट तैयार हो रही है। यह रिपोर्ट आप अपनी ASHA, ANM या डॉक्टर को दिखा सकती हैं। नमस्ते।"
  complete_clear: "{who}इतना ध्यान से बताने के लिए बहुत धन्यवाद। अगर आगे इनमें से कुछ भी दिखे, तो अपने स्वास्थ्य कार्यकर्ता से बात करें। आपकी रिपोर्ट तैयार हो रही है। यह रिपोर्ट आप अपनी ASHA, ANM या डॉक्टर को दिखा सकती हैं। नमस्ते।"

# How a child is named out loud: "मीरा 2 साल बेटी", oldest first.
roster_format:
  month_unit: "महीने"
  year_unit: "साल"
  tag_labels:
    male: "बेटा"
    female: "बेटी"
    unknown: ""
  patient_default_who: "माँ"
  # `items` is the child list: earlier children are separated by ", " and `or_joiner`
  # sits before the final alternative, so three children read "… रीना, 6 साल वाले अमन, या …".
  which_item:
    template: "यह किस बच्चे की बात है — {items}?"
    or_joiner: ", या "
    # Used only for children whose label repeats (equal-age twins), so two 2-year-olds are never read alike.
    ordinals: ["पहले", "दूसरे", "तीसरे", "चौथे"]
    named_female: "{age} वाली {name}"
    named_male: "{age} वाले {name}"
    unnamed_female: "{age} वाली बेटी"
    unnamed_male: "{age} वाले बेटे"
    unnamed_other: "{age} वाले"
    middle_female: " (बीच वाली)"
    middle_male: " (बीच वाले)"
