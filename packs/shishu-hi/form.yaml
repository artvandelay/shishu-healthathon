stem_prefixes:
- 'क्या '
profile_slots:
- id: caller_name
  type: string
  reask: जी, आराम से बताइए — आपका पूरा नाम क्या है?
roster:
  key: children
  tags:
  - male
  - female
  - unknown
  reask: जी, उन सभी बच्चों की उम्र क्या-क्या है?
  skip_if:
  - unmarried
  - about_to_marry
extractor_prompt: |-
  Extract ONLY demographic profile entities stated or directly answered by the caller's utterance given active_qid, active_prompt, optional current_profile, and optional current_roster. Return strictly matching JSON with only the four schema fields (caller_name, marital_status, roster_complete, roster), and leave every unmentioned field null.
  - caller_name: her given/family name only when actually stated; null for a lead-in fragment with no name. Never copy a diagnosis or disease name into caller_name.
  - marital_status: 'married', 'about_to_marry', or 'unmarried' when stated or directly answered (on intro_married a bare negative means 'unmarried' and a bare affirmative means 'married'); otherwise null. intro_married is normally answered by its own single_choice step that saves straight to the profile, so fill marital_status only when she volunteers or corrects it out of turn on another profile step.
  - roster: one item per INDIVIDUAL child whose age is known (age_years as float years >= 0, months as fractional years such as 0.5 for 6 months; tag 'male', 'female', or 'unknown'; optional personal name or null, never a disease name; id as described below). NEVER collapse twins or triplets into one item: "दो जुड़वाँ बच्चे हैं, 2 साल के" is two items with age_years 2.0 each. NEVER invent an age_years of 0 for a child whose age she did not give — that child simply has no item yet.
  - roster_complete: true when every child's age is accounted for, including "roster": [], "roster_complete": true for zero children on intro_children. false when she states a total count, or mentions additional or twin children, whose ages are not all accounted for yet: "मेरे तीन बच्चे हैं" with no ages is "roster": [] (or current_roster) with "roster_complete": false. Count the multiplicities she speaks, not just the ages she lists: "चार बच्चे हैं, दो-दो के दो ट्विंस हैं, 2 साल और 4 साल" has TWO pairs of twins, so it is four children — output all four items (2.0, 2.0, 4.0, 4.0) with "roster_complete": true, never three items and never false. When children are not mentioned or updated at all, set BOTH roster and roster_complete to null.
  - mid-call complaints that children were missed: when current_roster is already populated and she says her twins or children were NOT heard or not counted ("मेरे ट्विंस बच्चे हैं, मुझे लगता नहीं आप वो सुन पाए", "आपने एक बच्चा छोड़ दिया"), she IS updating children. Never leave roster and roster_complete both null on that turn: echo every child already on record with its existing id in "roster", and set "roster_complete": false, because a twin whose age she has not yet given has no item. Only an unrelated remark with no mention of children (her name, her marriage, a symptom) leaves both null.
  - id: how an item is matched to children already on record. current_roster lists every child already typed, with its id ("item_1", "item_2", ...). When current_roster is present and she adds, completes, or corrects children (for example supplying the remaining ages on a follow-up, or clarifying mid-call that she has twins), output the COMPLETE updated roster: repeat each existing child with its existing id unchanged, and set "id": null only for a newly added child whose age she has just given.
  - tag (child sex): read the kinship or gender word she actually used. बेटा, लड़का, बाबू, son, boy -> tag 'male'; बेटी, लड़की, गुड़िया, daughter, girl -> tag 'female'. Use 'unknown' ONLY when gender is genuinely unstated (for example "एक बच्चा है", "दो बच्चे हैं", or an age given with no sex word). Never answer 'unknown' for a child whose sex word was spoken.
  - names: when audio is attached, prefer the spoken audio pronunciation of a proper name over an ASR typo in utterance_text (for example आरव, not आरब; आरव is a name, आरब is not). Keep the name in Devanagari as pronounced, and never turn a kinship word into a name.
implications:
- when:
  - has_children
  set_profile:
    ever_pregnant: true
- when:
  - unmarried_or_engaged
  clear_roster_if_unprovided: true
  default_profile:
    ever_pregnant: false
semantic_flags:
  confirmed_hemoglobinopathy:
    instructions: >-
      Does caller_utterance explicitly state an already-diagnosed severe inherited blood/hemoglobin disorder
      in the child (such as thalassemia major or sickle cell disease) that is already under medical care?
    true_description: >-
      Explicitly states a confirmed diagnosis of thalassemia major, sickle cell disease, or another severe
      hemoglobinopathy already diagnosed by a doctor.
    false_description: >-
      Routine symptom answer, carrier/trait test check, jaundice, anemia without a confirmed hemoglobinopathy
      diagnosis, or unmentioned.
    min_yes: 0.85
rules:
  unmarried:
    field: marital_status
    op: eq
    value: unmarried
  about_to_marry:
    field: marital_status
    op: eq
    value: about_to_marry
  unmarried_or_engaged:
    field: marital_status
    op: in
    value:
    - unmarried
    - about_to_marry
  no_children:
    roster_op: is_empty
  has_children:
    roster_op: non_empty
  multi_child:
    roster_op: count_gt
    value: 1
  no_child_5_plus:
    roster_op: none_match
    min_age: 5
  all_under_10:
    roster_op: none_match
    min_age: 10
  no_daughter_11_plus:
    roster_op: none_match
    tag: female
    min_age: 11
  ever_pregnant_no:
    any_of:
    - field: ever_pregnant
      op: eq
      value: false
    - all_of:
      - unmarried_or_engaged
      - field: ever_pregnant
        op: ne
        value: true
  no_family_concern:
    group_no_concern: family
  known_hemoglobinopathy:
    semantic_flag: confirmed_hemoglobinopathy
